name: Build MD-UV390 10W firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [release, full, dev-sweep, dev-prof, dev-aes, dev-gps]
    name: build (PROFILE=${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: Build
        working-directory: MDUV380_firmware
        run: make -j$(nproc) PROFILE=${{ matrix.profile }} REPRODUCIBLE=1
      - name: Assert codec-merge-capable size
        working-directory: MDUV380_firmware
        run: |
          sz=$(stat -c%s build/openuv380-10w.bin)
          echo "firmware .bin size: $sz bytes"
          # must be >= codec write offset (0x6937C) + codec size (0x48BB0) = 728876
          test "$sz" -ge 728876 || { echo "ERROR: .bin too small to receive the AMBE codec merge (FM-only)"; exit 1; }
          echo "OK: reserved codec region present, ready for flash-time merge."
      - uses: actions/upload-artifact@v4
        with:
          name: openuv380-10w-${{ matrix.profile }}
          path: |
            MDUV380_firmware/build/*.bin
            MDUV380_firmware/build/*.hex
            MDUV380_firmware/build/*.elf

  forbidden-combinations:
    runs-on: ubuntu-latest
    name: forbidden flag combinations are refused
    steps:
      - uses: actions/checkout@v4
      - name: The Makefile must refuse these at parse time
        working-directory: MDUV380_firmware
        run: |
          for bad in "ENABLE_SCAN_PROFILER=1" "DMR_AES_DIAG_PATTERN=1 DMR_AES_DIAG_ENCPAT=1" "PROFILE=no-such-profile"; do
            if make -s flags $bad > /dev/null 2>&1; then echo "FAIL: 'make $bad' was accepted"; exit 1; fi
            echo "ok: 'make $bad' refused"
          done
